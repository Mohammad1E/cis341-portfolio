<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - 180394 - Mohammad Abu Awwad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="content-section contact-section">
      <h1>Contact Me</h1>
      <p class="section-note">Please complete all fields before submitting the form.</p>
      <form id="contactForm" onsubmit="return validateForm()" class="contact-form">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Your full name" />

        <label for="emailAddress">Email Address</label>
        <input type="email" id="emailAddress" name="emailAddress" placeholder="you@example.com" />

        <label for="country">Country</label>
        <input type="text" id="country" name="country" placeholder="Your country" />

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5" placeholder="Your message"></textarea>

        <button type="submit" class="button">Submit</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>Portfolio contact page | Mohammad Abu Awwad</p>
      <a href="index.html">Home</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
